source_cells = ["33", "d2exp / d2xtalk / d2xmusic `(attributes)` CRC32s", "Every ADPCM-packed WAV's CRC32 fails against its decompressed bytes (d2exp 572, d2xtalk 476, d2xmusic 10: 1058 of 1058), and every losslessly packed file passes (d2exp's 3 PKWARE WAVs and 9280 other files). The second sector's compression byte (0x41 / 0x81 ADPCM vs 0x08 PKWARE, read by decrypting it) splits them exactly, so the CRC is of the PCM before the lossy ADPCM packing: no reader can match it, and the data isn't damaged. game.exe doesn't check them.", "high (the split is exact on one install)", "work around: the launcher's Verify skips WAV CRC32s, still reads them through (`mpq::verify`)", "2026-10-28, launcher verify"]
source_kind = "documented"

